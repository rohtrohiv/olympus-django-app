{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;margin:60px auto;padding:32px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,0.08);">
  <h2 style="margin-bottom:24px;text-align:center;">Login</h2>
  {% if ENABLE_AZURE_SSO %}
    <a href="{% url AZURE_LOGIN_URL_NAME %}" style="display:block;width:100%;text-align:center;background:#2563eb;color:#fff;border-radius:6px;padding:12px 0;font-weight:600;text-decoration:none;">Sign in with Microsoft</a>
    <p style="margin-top:16px;font-size:13px;color:#475569;text-align:center;">Use your Olympus Microsoft 365 account to continue.</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="width:100%;background:#3FE0F0;color:#0B3A3F;border:none;border-radius:6px;padding:12px 0;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;">Login</button>
    </form>
  {% endif %}
</div>
{% endblock %}
